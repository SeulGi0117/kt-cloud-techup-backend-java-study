spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopping
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # create = 테이블을 만들기만
      # update = 테이블 없으면 만들고, 있지만 entity랑 다르면 수정 -> 근데 삭제는 안해줌
      # validate = 테이블이랑 entity랑 맞는지 확인만
      # none = 아무것도 안해줌
      # create-drop = create랑 똑같은데 애플리케이션 종료시점에 테이블을 drop함 => 테스트코드에서만 씀. 다른데서 절대쓰지마셈
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Seoul
        show_sql: true  # 로컬에서만 써야됨.. 돈 개많이 나옴 aws절대 ㄴㄴ
        # 배치사이즈 얘는 정말 조심해서 사용해야함.
#        default_batch_fetch_size: 2 # 카테고리나 대분류 중분류 소분류, 리뷰도 댓글 대댓글. .. 이런 모든 구조에 다 디폴드 배치 사이즈로 적용이 될수있다
    show-sql: true
  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}

jwt:
  secret: &{kt.jwt.secret:kt-cloud-tech-up-shopping-20251117110752}
    access-token-expiration: ${kt.jwt.access-token-expiration:300000} # 5분
    refresh-token-expiration: ${kt.jwt.secret:kt-cloud-tech-up:90000} # 12시간